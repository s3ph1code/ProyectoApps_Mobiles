name: doulapp
description: "Doulapp — acompañamiento posparto."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.7.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

# Las versiones recientes de path_provider_foundation arrastran objective_c,
# cuyo hook de native assets falla si la ruta del SDK de Flutter contiene
# espacios. 2.4.1 no lo arrastra. Se puede quitar este bloque cuando el SDK
# viva en una ruta sin espacios (por ejemplo C:/flutter).
dependency_overrides:
  path_provider_foundation: 2.4.1
